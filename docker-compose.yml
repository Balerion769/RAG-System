services:
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["advanced"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    profiles: ["advanced"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/interviewcoach
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_storage:
  neo4j_data:

