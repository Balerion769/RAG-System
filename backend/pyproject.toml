[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-coach-backend"
version = "0.1.0"
description = "Local-first multimodal agentic RAG backend for an AI interview coach."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
adk = [
  "google-adk>=0.1.0",
  "litellm!=1.82.7,!=1.82.8"
]
rag = [
  "sentence-transformers>=3.0.0",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.9.0",
  "ragas>=0.2.0"
]
multimodal = [
  "faster-whisper>=1.0.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "opencv-python>=4.9.0"
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

